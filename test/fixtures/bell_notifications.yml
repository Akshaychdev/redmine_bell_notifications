  body: Admin updated an issue in eCookbook
  url: /issues/2
  read_at: <%= 1.day.ago.to_fs(:db) %>
  created_at: <%= 3.days.ago.to_fs(:db) %>
  updated_at: <%= 1.day.ago.to_fs(:db) %>

