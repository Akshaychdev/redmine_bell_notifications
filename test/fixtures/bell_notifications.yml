---
# Bell Notification Fixtures

# Unread notification for user 2 (jsmith) about issue 1
bell_notifications_001:
  id: 1
  user_id: 2
  notifiable_type: Issue
  notifiable_id: 1
  event_type: issue_added
  actor_id: 3
  title: New issue #1: Cannot print recipes
  body: Dave Lopper created a new issue in eCookbook
  url: /issues/1
  read_at: null
  created_at: <%= 2.days.ago.to_fs(:db) %>
  updated_at: <%= 2.days.ago.to_fs(:db) %>

# Read notification for user 2 about issue 2
bell_notifications_002:
  id: 2
  user_id: 2
  notifiable_type: Issue
  notifiable_id: 2
